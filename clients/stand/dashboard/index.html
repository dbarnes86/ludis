<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STAND — Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Manrope:wght@400;500;600;700;800&family=Caveat:wght@400;700&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'Manrope',sans-serif;background:#FFF8E7;color:#1A1A1A;overflow-x:hidden;min-height:100%}

.bagel{font-family:'Bagel Fat One',system-ui,sans-serif;line-height:1.05}
.caveat{font-family:'Caveat',cursive;font-weight:700}

/* ── APP / VIEWS ── */
#app{position:relative;width:100%;min-height:100vh;overflow-x:hidden}
.view{width:100%;min-height:100vh;transition:transform .3s ease,opacity .3s ease;background:#FFF8E7}
.view.offstage{display:none}
.view.anim-absolute{position:absolute;top:0;left:0;right:0}
.view.slide-out-left{transform:translateX(-100%)}
.view.slide-out-right{transform:translateX(100%)}
.view.slide-in-from-right{transform:translateX(100%)}
.view.slide-in-from-left{transform:translateX(-100%)}
.view.slide-in-active{transform:translateX(0)}

/* ── DASHBOARD COLUMN ── */
.dash-col{max-width:480px;margin:0 auto;padding:0 20px 64px}
@media(min-width:1280px){.dash-col{max-width:880px;padding:0 32px 80px}}

/* ── SECTION ENTRANCE ── */
.dsec{opacity:0;transform:translateY(16px);animation:secIn .5s ease-out forwards}
@keyframes secIn{to{opacity:1;transform:translateY(0)}}
.dsec.d1{animation-delay:.05s}.dsec.d2{animation-delay:.12s}.dsec.d3{animation-delay:.19s}
.dsec.d4{animation-delay:.26s}.dsec.d5{animation-delay:.33s}.dsec.d6{animation-delay:.40s}.dsec.d7{animation-delay:.47s}

/* ── HEADER ── */
.hdr{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:18px 0 14px;border-bottom:2px solid rgba(26,26,26,.07);margin-bottom:18px;
}
.hdr-wordmark{font-family:'Bagel Fat One',system-ui,sans-serif;font-size:24px;color:#E5341A;letter-spacing:.01em}
.hdr-biz{display:flex;align-items:center;gap:8px;min-width:0}
.hdr-avatar{
  width:30px;height:30px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;
  font-family:'Bagel Fat One',system-ui,sans-serif;font-size:12px;color:#fff;
}
.hdr-bizname{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-right{display:flex;align-items:center;gap:8px;flex:none}
.hdr-pill{
  font-size:11px;font-weight:800;padding:6px 10px;border-radius:999px;
  background:#1A1A1A;color:#FFF8E7;white-space:nowrap;
}
.hdr-streak{background:#FFD93D;color:#1A1A1A}
.hdr-avatar-wrap{position:relative;flex:none}
.hdr-badge-bub{
  position:absolute;bottom:-5px;right:-7px;width:18px;height:18px;border-radius:50%;
  background:#FFF8E7;border:1.5px solid rgba(26,26,26,.15);
  display:flex;align-items:center;justify-content:center;font-size:10px;line-height:1;
  cursor:pointer;
}
@media(max-width:480px){.hdr-bizname{max-width:110px}.hdr-wordmark{font-size:20px}}

/* ── BADGES ── */
.sec-note{font-size:11px;font-weight:700;color:rgba(26,26,26,.4);margin-left:10px}
.badge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(min-width:720px){.badge-grid{grid-template-columns:repeat(8,1fr)}}
.badge-tile{
  background:#fff;border:2px solid rgba(26,26,26,.07);border-radius:16px;
  padding:14px 6px 12px;text-align:center;cursor:pointer;position:relative;
  transition:border-color .15s,transform .12s,box-shadow .15s;
}
.badge-tile:not(.locked):hover{border-color:#1A1A1A}
.badge-tile:not(.locked):active{transform:scale(.95)}
.badge-tile.equipped{border-color:#E5341A;border-width:2.5px;box-shadow:0 4px 0 rgba(229,52,26,.25)}
.badge-tile.locked{opacity:.45;cursor:default;background:transparent;border-style:dashed}
.badge-emoji{font-size:28px;line-height:1;margin-bottom:8px}
.badge-tile.locked .badge-emoji{filter:grayscale(1)}
.badge-name{font-family:'Bagel Fat One',system-ui,sans-serif;font-size:10px;line-height:1.2;margin-bottom:4px}
.badge-req{font-size:9px;font-weight:600;color:rgba(26,26,26,.45);line-height:1.3}
.badge-on{
  position:absolute;top:-7px;left:50%;transform:translateX(-50%);
  background:#E5341A;color:#FFF8E7;font-size:8px;font-weight:800;
  letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:999px;
  white-space:nowrap;
}

/* ── XP BAR ── */
.xp-wrap{margin-bottom:24px}
.xp-amount{text-align:center;font-size:12px;font-weight:800;color:rgba(26,26,26,.6);margin-bottom:6px}
.xp-row{display:flex;align-items:center;gap:12px}
.xp-lv{font-family:'Bagel Fat One',system-ui,sans-serif;font-size:14px;flex:none}
.xp-track{
  flex:1;height:16px;border-radius:999px;background:#fff;
  border:2px solid rgba(26,26,26,.1);overflow:hidden;
}
.xp-fill{
  height:100%;width:0%;background:#E5341A;border-radius:999px;
  transition:width .5s ease-out;
}

/* ── CARDS / SECTION HEADINGS ── */
.sec-h{font-family:'Bagel Fat One',system-ui,sans-serif;font-size:22px;margin:28px 0 14px}
.card{
  background:#fff;border-radius:20px;padding:20px;
  border:2px solid rgba(26,26,26,.07);
}

/* ── BUSINESS SNAPSHOT ── */
.snap{display:flex;flex-direction:column;gap:14px}
.snap-top{display:flex;align-items:center;gap:14px}
.snap-avatar{
  width:54px;height:54px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;
  font-family:'Bagel Fat One',system-ui,sans-serif;font-size:20px;color:#fff;
}
.snap-name{font-family:'Bagel Fat One',system-ui,sans-serif;font-size:20px;line-height:1.15}
.snap-type{font-size:12px;font-weight:700;color:rgba(26,26,26,.5);margin-top:3px;text-transform:uppercase;letter-spacing:.08em}
.snap-pills{display:flex;flex-wrap:wrap;gap:8px}
.stat-pill{
  font-size:12px;font-weight:700;padding:7px 12px;border-radius:999px;
  background:#FFF8E7;border:2px solid rgba(26,26,26,.08);
}
.snap-cta{
  font-size:14px;font-weight:800;color:#E5341A;text-decoration:none;
  display:inline-block;cursor:pointer;
}
.snap-cta:active{transform:scale(.96)}

/* ── TASKS ── */
.task-list{display:flex;flex-direction:column;gap:12px}
.task{
  display:flex;align-items:center;gap:14px;background:#fff;border-radius:18px;
  padding:16px 18px;border:2px solid rgba(26,26,26,.07);cursor:pointer;
  transition:opacity .3s ease,transform .12s ease;
}
.task:active{transform:scale(.98)}
.task.done{opacity:.6;cursor:default}
.task-check{
  width:28px;height:28px;border-radius:50%;flex:none;
  border:2.5px solid rgba(26,26,26,.2);background:#fff;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s ease,border-color .2s ease;
}
.task.done .task-check{background:#2D9F6E;border-color:#2D9F6E;animation:checkPop .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes checkPop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.task-check svg{display:none}
.task.done .task-check svg{display:block}
.task-copy{flex:1;min-width:0}
.task-title{font-size:15px;font-weight:800;margin-bottom:2px}
.task.done .task-title{text-decoration:line-through}
.task-desc{font-size:13px;font-weight:500;color:rgba(26,26,26,.55);line-height:1.45}
.task-arrow{flex:none;font-size:16px;color:rgba(26,26,26,.3);font-weight:800}

/* ── LESSON CAROUSEL ── */
.carousel{
  display:flex;gap:16px;overflow-x:auto;padding:4px 4px 16px;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;
}
.carousel::-webkit-scrollbar{height:6px}
.carousel::-webkit-scrollbar-thumb{background:rgba(26,26,26,.15);border-radius:3px}
.lcard{
  width:200px;flex:none;height:240px;scroll-snap-align:start;
  background:#fff;border-radius:20px;padding:18px 16px;
  border:2px solid rgba(26,26,26,.08);cursor:pointer;position:relative;
  display:flex;flex-direction:column;
  transition:transform .15s ease,box-shadow .15s ease;
}
.lcard:not(.locked):hover{transform:translateY(-3px);box-shadow:0 6px 0 rgba(26,26,26,.08)}
.lcard:not(.locked):active{transform:scale(.97)}
.lcard.review{border-color:#F4A261;border-width:2.5px}
.lcard.completed{opacity:.78}
.lcard.locked{opacity:.5;cursor:default}
.lcard-icon{
  width:56px;height:56px;border-radius:16px;font-size:30px;
  display:flex;align-items:center;justify-content:center;margin-bottom:12px;
}
.lcard-title{font-family:'Bagel Fat One',system-ui,sans-serif;font-size:15px;line-height:1.15;margin-bottom:6px}
.lcard-desc{
  font-size:11.5px;font-weight:500;color:rgba(26,26,26,.55);line-height:1.45;flex:1;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.lbadge{
  align-self:flex-start;font-size:11px;font-weight:800;padding:5px 10px;
  border-radius:999px;margin-top:10px;
}
.lbadge.b-done{background:#2D9F6E;color:#fff}
.lbadge.b-start{background:#E5341A;color:#fff}
.lbadge.b-review{background:#F4A261;color:#1A1A1A}
.lbadge.b-locked{background:rgba(26,26,26,.08);color:rgba(26,26,26,.5)}
/* lock tooltip */
.lcard-format{
  font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:#b06a2c;margin-bottom:8px;
}
.lcard.locked::after{
  content:"🔒 Not yet unlocked";
  position:absolute;left:50%;top:8px;transform:translateX(-50%) translateY(-4px);
  background:#1A1A1A;color:#FFF8E7;font-size:11px;font-weight:700;
  padding:6px 10px;border-radius:8px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .15s ease,transform .15s ease;z-index:5;
}
.lcard.locked:hover::after{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── PROGRESS BARS ── */
.pbar-row{margin-bottom:16px}
.pbar-labels{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.pbar-name{font-size:13px;font-weight:800}
.pbar-val{font-size:12px;font-weight:700;color:rgba(26,26,26,.55)}
.pbar-track{height:14px;border-radius:999px;background:#fff;border:2px solid rgba(26,26,26,.08);overflow:hidden}
.pbar-fill{height:100%;width:0%;border-radius:999px;transition:width .3s ease-out}

/* ── OTHER BUSINESSES ── */
.biz-row{display:flex;gap:12px;overflow-x:auto;padding:4px 4px 16px;-webkit-overflow-scrolling:touch}
.biz-row::-webkit-scrollbar{height:6px}
.biz-row::-webkit-scrollbar-thumb{background:rgba(26,26,26,.15);border-radius:3px}
.bcard{
  width:150px;flex:none;background:#fff;border-radius:18px;padding:16px 14px;
  border:2px solid rgba(26,26,26,.07);text-align:center;
  display:block;text-decoration:none;color:#1A1A1A;cursor:pointer;
  transition:border-color .15s,transform .12s;
}
.bcard:hover{border-color:#1A1A1A}
.bcard:active{transform:scale(.97)}
.bcard-visit{
  display:block;margin-top:10px;font-size:10px;font-weight:800;
  letter-spacing:.08em;text-transform:uppercase;color:#E5341A;
}
.bcard-emoji{
  width:48px;height:48px;border-radius:50%;margin:0 auto 10px;font-size:24px;
  display:flex;align-items:center;justify-content:center;
}
.bcard-name{font-family:'Bagel Fat One',system-ui,sans-serif;font-size:13px;line-height:1.2;margin-bottom:6px}
.bcard-type{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(26,26,26,.45);margin-bottom:8px}
.bcard-sales{
  display:inline-block;font-size:11px;font-weight:800;padding:4px 10px;
  border-radius:999px;background:#FFD93D;
}

/* ── BUTTONS ── */
.btn{
  display:block;width:100%;padding:18px 24px;border:none;border-radius:16px;
  font-family:'Bagel Fat One',system-ui,sans-serif;font-size:18px;
  cursor:pointer;transition:transform .12s,opacity .12s,box-shadow .12s;
  text-align:center;line-height:1;
}
.btn-red{background:#E5341A;color:#FFF8E7;box-shadow:0 4px 0 #a81e08}
.btn-red:active{box-shadow:0 2px 0 #a81e08;transform:translateY(2px) scale(.96)}
.btn-black{background:#1A1A1A;color:#FFF8E7;box-shadow:0 4px 0 #000}
.btn-black:active{box-shadow:0 2px 0 #000;transform:translateY(2px) scale(.96)}
.btn-yellow{background:#FFD93D;color:#1A1A1A;box-shadow:0 4px 0 #c9a800}
.btn-yellow:active{box-shadow:0 2px 0 #c9a800;transform:translateY(2px) scale(.96)}
.btn:disabled{opacity:.35;pointer-events:none;box-shadow:none}

/* ── LESSON VIEW ── */
.lesson-col{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:0 20px 32px}
.ltop{
  display:flex;align-items:center;gap:12px;padding:18px 0 12px;
}
.lback{
  width:40px;height:40px;border-radius:12px;border:2px solid rgba(26,26,26,.12);
  background:#fff;font-size:18px;font-weight:800;cursor:pointer;flex:none;
  display:flex;align-items:center;justify-content:center;
  transition:transform .12s ease;
}
.lback:active{transform:scale(.92)}
.ltitle{flex:1;text-align:center;font-family:'Bagel Fat One',system-ui,sans-serif;font-size:16px;line-height:1.15}
.lxp{
  flex:none;font-size:11px;font-weight:800;padding:6px 10px;border-radius:999px;
  background:#FFD93D;white-space:nowrap;
}
.ldots{display:flex;gap:6px;justify-content:center;margin:6px 0 20px}
.ldot{width:8px;height:8px;border-radius:50%;background:rgba(26,26,26,.15);transition:background .3s}
.ldot.done{background:rgba(26,26,26,.55)}
.ldot.now{background:#E5341A}

.lsteps{flex:1;position:relative;display:flex;flex-direction:column}
.lstep{
  flex:1;display:none;flex-direction:column;
}
.lstep.active{display:flex;animation:stepInR .3s ease-out}
.lstep.active.from-left{animation:stepInL .3s ease-out}
@keyframes stepInR{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:translateX(0)}}
@keyframes stepInL{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:translateX(0)}}
.lstep-body{flex:1;display:flex;flex-direction:column}
.lstep-cta{margin-top:28px}

/* STAND voice bubble */
.voice{
  background:#E5341A;color:#FFF8E7;border-radius:18px;border-bottom-left-radius:4px;
  padding:16px 18px;margin-bottom:22px;position:relative;
}
.voice-label{
  font-family:'Bagel Fat One',system-ui,sans-serif;font-size:10px;letter-spacing:.15em;
  color:rgba(255,248,231,.75);margin-bottom:6px;
}
.voice-text{font-size:14.5px;font-weight:600;line-height:1.55}

.lh{font-family:'Bagel Fat One',system-ui,sans-serif;font-size:24px;line-height:1.15;margin-bottom:18px}
.lsub{font-size:14px;font-weight:500;color:rgba(26,26,26,.6);line-height:1.55;margin-bottom:18px}

.hero-emoji{
  font-size:88px;text-align:center;margin:auto 0;padding:32px 0;
  animation:heroFloat 3s ease-in-out infinite;
}
@keyframes heroFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.hero-prompt{
  font-family:'Caveat',cursive;font-weight:700;font-size:28px;text-align:center;
  color:rgba(26,26,26,.75);line-height:1.25;margin-bottom:auto;
}

/* form fields */
.fblock{background:#fff;border-radius:16px;padding:16px 18px;border:2px solid rgba(26,26,26,.07);margin-bottom:12px;transition:border-color .2s}
.fblock:focus-within{border-color:#1A1A1A}
.flabel{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:rgba(26,26,26,.5);margin-bottom:8px}
.frow{display:flex;align-items:center;gap:4px}
.fsym{font-family:'Bagel Fat One',system-ui,sans-serif;font-size:24px}
.fin{
  flex:1;width:100%;border:none;outline:none;background:transparent;
  font-family:'Bagel Fat One',system-ui,sans-serif;font-size:24px;color:#1A1A1A;
  -moz-appearance:textfield;min-width:0;
}
.fin::-webkit-outer-spin-button,.fin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.fin::placeholder{color:rgba(26,26,26,.2)}
.fin-text{
  width:100%;border:none;outline:none;background:transparent;
  font-family:'Manrope',sans-serif;font-size:16px;font-weight:600;color:#1A1A1A;
}
.fin-text::placeholder{color:rgba(26,26,26,.25);font-style:italic}
.fnote{font-size:11px;font-weight:600;color:rgba(26,26,26,.45);margin-top:6px}
.f2col{display:flex;gap:12px}
.f2col .fblock{flex:1;margin-bottom:0}
.f2col-wrap{margin-bottom:12px}
.fx{font-family:'Bagel Fat One',system-ui,sans-serif;font-size:20px;align-self:center;color:rgba(26,26,26,.4)}

/* calc results */
.calc-out{background:#1A1A1A;border-radius:18px;padding:18px 20px;margin:8px 0 14px}
.calc-line{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.calc-line:last-child{margin-bottom:0}
.calc-k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,248,231,.55)}
.calc-v{font-family:'Bagel Fat One',system-ui,sans-serif;font-size:26px;color:#FFF8E7;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.calc-v.big{font-size:34px;color:#FFD93D}
.calc-v.pop{transform:scale(1.12)}
.profit-pill{
  display:inline-block;background:#2D9F6E;color:#fff;font-weight:800;font-size:14px;
  padding:9px 16px;border-radius:999px;margin-bottom:14px;align-self:flex-start;
}

/* preview panel */
.preview-panel{
  background:#FFD93D;border-radius:18px;padding:18px 20px;margin:10px 0 14px;
}
.preview-label{font-size:10px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:rgba(26,26,26,.5);margin-bottom:8px}
.preview-text{font-size:15px;font-weight:600;line-height:1.6}
.preview-text .ph{color:rgba(26,26,26,.35);font-style:italic}

/* output asset cards */
.asset-card{
  border-radius:22px;padding:26px 24px;color:#fff;margin:6px 0 16px;
  box-shadow:0 10px 40px rgba(26,26,26,.18);
  animation:assetIn .45s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes assetIn{from{transform:scale(.9) translateY(14px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.asset-biz{font-family:'Bagel Fat One',system-ui,sans-serif;font-size:22px;margin-bottom:16px;line-height:1.15}
.asset-line{font-size:16px;font-weight:700;margin-bottom:10px;line-height:1.45}
.asset-line .asset-big{font-family:'Bagel Fat One',system-ui,sans-serif;font-size:30px;display:block;margin-top:2px}
.asset-para{font-size:14.5px;font-weight:600;line-height:1.65;margin-bottom:12px}
.asset-sec-label{font-size:10px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;opacity:.7;margin:14px 0 8px}
.asset-foot{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.55;margin-top:18px}
.asset-li{font-size:14px;font-weight:600;line-height:1.5;margin-bottom:6px}
.save-btn{
  display:block;width:100%;padding:14px;border:none;border-radius:14px;cursor:pointer;
  background:#fff;color:#1A1A1A;font-family:'Bagel Fat One',system-ui,sans-serif;font-size:15px;
  box-shadow:0 4px 0 rgba(26,26,26,.25);transition:transform .12s;
}
.save-btn:active{transform:translateY(2px) scale(.97);box-shadow:0 2px 0 rgba(26,26,26,.25)}

/* option cards (launch step 1) */
.opt-card{
  background:#fff;border:2.5px solid rgba(26,26,26,.1);border-radius:18px;
  padding:18px 20px;cursor:pointer;margin-bottom:12px;
  font-size:16px;font-weight:700;transition:border-color .15s,background .15s,transform .12s;
}
.opt-card:active{transform:scale(.97)}
.opt-card.sel{border-color:#E5341A;background:#fdeae6}

/* chips (warm list) */
.chip-group{background:#fff;border-radius:16px;padding:14px 16px;border:2px solid rgba(26,26,26,.07);margin-bottom:12px}
.chip-cat{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:rgba(26,26,26,.5);margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chips:empty{display:none}
.chip{
  background:#FFD93D;font-size:13px;font-weight:800;padding:7px 13px;border-radius:999px;
  animation:chipIn .25s cubic-bezier(.34,1.56,.64,1);
}

/* per-lesson working state */
const lessonState = {
  "price-it-right": { ing: 4.50, pack: 0.80, rate: 8.00, hours: 0.5, cost: 0, price: 0, profit: 0 },
  "find-your-customer": { age: "", hangout: "", reason: "", differentiator: "" },
  "launch-plan": { when: null, family: [], friends: [], neighbours: [], channels: [] }
};

let currentLessonId = null;
let currentStep = 0;

const $ = (id) => document.getElementById(id);

function escHTML(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* ════════════════════════ XP / TOASTS ════════════════════════ */

function refreshXPUI(animateFromZero){
  $("hdr-level").textContent = `CEO • Lv.${USER.level}`;
  $("hdr-streak").textContent = `🔥 ${USER.streak}`;
  $("xp-amount").textContent = `${USER.xp} / ${USER.xpToNextLevel} XP`;
  $("xp-lv-left").textContent = `Level ${USER.level}`;
  $("xp-lv-right").textContent = `Level ${USER.level + 1}`;
  const pct = Math.min(100, USER.xp / USER.xpToNextLevel * 100);
  const fill = $("xp-fill");
  if (animateFromZero){
    fill.style.width = "0%";
    requestAnimationFrame(() => requestAnimationFrame(() => { fill.style.width = pct + "%"; }));
  } else {
    fill.style.width = pct + "%";
  }
}

function addXP(n){
  USER.xp += n;
  let levelled = false;
  while (USER.xp >= USER.xpToNextLevel){
    USER.xp -= USER.xpToNextLevel;
    USER.level += 1;
    levelled = true;
  }
  refreshXPUI(false);
  if (levelled){
    setTimeout(() => xpToast(`Level up! CEO Lv.${USER.level} 🎉`), 600);
  }
}

function xpToast(text){
  const el = document.createElement("div");
  el.className = "xp-toast";
  el.textContent = text;
  $("toast-zone").appendChild(el);
  setTimeout(() => el.remove(), 1600);
}

/* ════════════════════════ CONFETTI ════════════════════════ */

function fireConfetti(){
  const canvas = document.createElement("canvas");
  canvas.id = "confetti-canvas";
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext("2d");
  const colors = ["#E5341A", "#FFD93D", "#FFF8E7"];
  const parts = [];
  for (let i = 0; i < 90; i++){
    parts.push({
      x: canvas.width / 2 + (Math.random() - 0.5) * 120,
      y: canvas.height * 0.55,
      vx: (Math.random() - 0.5) * 14,
      vy: -6 - Math.random() * 11,
      size: 5 + Math.random() * 7,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.4,
      color: colors[i % 3]
    });
  }
  const start = performance.now();
  function frame(now){
    const t = now - start;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    parts.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.45; p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, 1 - t / 1000);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      ctx.restore();
    });
    if (t < 1000){ requestAnimationFrame(frame); } else { canvas.remove(); }
  }
  requestAnimationFrame(frame);
}

function renderHeader(){
  $("hdr-avatar").style.background = USER.logoColor;
  $("hdr-avatar").textContent = USER.logoInitials;
  $("hdr-bizname").textContent = USER.businessName;
  const badge = BADGES.find(b => b.id === USER.equippedBadge);
  const bub = $("hdr-badge-bub");
  if (badge){
    bub.textContent = badge.emoji;
    bub.title = badge.name + " — " + badge.req;
    bub.style.display = "flex";
  } else {
    bub.style.display = "none";
  }
}

function renderBadges(){
  $("badge-grid").innerHTML = BADGES.map(b => {
    const equipped = b.earned && b.id === USER.equippedBadge;
    const cls = ["badge-tile"];
    if (!b.earned) cls.push("locked");
    if (equipped) cls.push("equipped");
    return `
    <div class="${cls.join(" ")}" ${b.earned ? `onclick="equipBadge('${b.id}')"` : ""}>
      ${equipped ? `<span class="badge-on">Showing</span>` : ""}
      <div class="badge-emoji">${b.emoji}</div>
      <div class="badge-name">${escHTML(b.name)}</div>
      <div class="badge-req">${b.earned ? escHTML(b.req) : "🔒 " + escHTML(b.req)}</div>
    </div>`;
  }).join("");
}

function equipBadge(id){
  const badge = BADGES.find(b => b.id === id);
  if (!badge || !badge.earned || USER.equippedBadge === id) return;
  USER.equippedBadge = id;
  renderBadges();
  renderHeader();
  xpToast(`${badge.emoji} ${badge.name} is now on your profile`);
}

function scrollToBadges(){
  const el = $("badges-section");
  if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
}

function renderSnapshot(){
  $("snap-avatar").style.background = USER.logoColor;
  $("snap-avatar").textContent = USER.logoInitials;
  $("snap-name").textContent = USER.businessName;
  $("snap-type").textContent = USER.businessType;
  $("snap-pills").innerHTML = [
    `🛍 ${USER.totalSales} sales`,
    `👀 ${USER.storeViews} store views`,
    `📅 ${USER.daysActive} days active`
  ].map(t => `<span class="stat-pill">${t}</span>`).join("");
}

function renderTasks(){
  $("task-list").innerHTML = TASKS.map(t => `
    <div class="task ${t.done ? "done" : ""}" id="task-${t.id}" onclick="completeTask('${t.id}')">
      <div class="task-check">
        <svg width="13" height="10" viewBox="0 0 14 11" fill="none">
          <path d="M1.5 5.5L5.5 9.5L12.5 1.5" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="task-copy">
        <div class="task-title">${escHTML(t.title)}</div>
        <div class="task-desc">${escHTML(t.desc)}</div>
      </div>
      <div class="task-arrow">→</div>
    </div>`).join("");
}

function completeTask(id){
  const t = TASKS.find(x => x.id === id);
  if (!t || t.done) return;
  t.done = true;
  const card = $("task-" + id);
  card.classList.add("done");
  xpToast("+50 XP");
  addXP(50);
  if (TASKS.every(x => x.done)){
    setTimeout(fireConfetti, 350);
  }
}

function badgeFor(status){
  if (status === "COMPLETED") return `<span class="lbadge b-done">✓ Done</span>`;
  if (status === "AVAILABLE") return `<span class="lbadge b-start">Start →</span>`;
  if (status === "FOR_REVIEW") return `<span class="lbadge b-review">👁 Review</span>`;
  return `<span class="lbadge b-locked">🔒 Coming soon</span>`;
}

function renderCarousel(){
  $("lesson-carousel").innerHTML = LESSONS.map(l => {
    const locked = (l.status === "LOCKED" || l.status === "COMING_SOON");
    const cls = ["lcard"];
    if (locked) cls.push("locked");
    if (l.status === "FOR_REVIEW") cls.push("review");
    if (l.status === "COMPLETED") cls.push("completed");
    const click = locked ? "" : `onclick="openLesson('${l.id}')"`;
    return `
    <div class="${cls.join(" ")}" ${click}>
      <div class="lcard-icon" style="background:${l.color}22;color:${l.color}">${l.icon}</div>
      <div class="lcard-title">${escHTML(l.title)}</div>
      <div class="lcard-desc">${escHTML(l.description)}</div>
      ${l.format ? `<div class="lcard-format">${l.format}</div>` : ""}

}

function renderProgressBars(animate){

    if (animate){

    } else {
      el.style.width = pct + "%";

  set("pb-lessons", done / LESSONS.length * 100);

  set("pb-streak", Math.min(100, USER.streak / 30 * 100));

  set("pb-days", USER.daysActive);
}

function renderOtherBusinesses(){

      <div class="bcard-emoji" style="background:${b.color}22">${b.emoji}</div>

/* ════════════════════════ ROUTER / VIEW TRANSITIONS ════════════════════════ */

function openLesson(id){
  const lesson = LESSONS.find(l => l.id === id);
  if (lesson && lesson.external){
    window.location.href = lesson.external;
    return;
  }
  location.hash = "#lesson/" + id;
}

function goDashboard(){
  location.hash = "#dashboard";
}

function switchView(showEl, hideEl, dir){
  /* dir = 1 → forward (new view enters from right), -1 → back */
  if (hideEl.classList.contains("offstage")){
    showEl.classList.remove("offstage");
    window.scrollTo(0, 0);
    return;
  }
  viewAnimating = true;
  hideEl.classList.add("anim-absolute");
  showEl.classList.remove("offstage");
  showEl.classList.add(dir === 1 ? "slide-in-from-right" : "slide-in-from-left");
  window.scrollTo(0, 0);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    hideEl.classList.add(dir === 1 ? "slide-out-left" : "slide-out-right");
    showEl.classList.add("slide-in-active");
    showEl.classList.remove("slide-in-from-right", "slide-in-from-left");
  }));
  setTimeout(() => {
    hideEl.classList.add("offstage");
    hideEl.classList.remove("anim-absolute", "slide-out-left", "slide-out-right");
    showEl.classList.remove("slide-in-active");
    viewAnimating = false;
  }, 320);
}

function route(){
  const hash = location.hash || "#dashboard";
  const dash = $("view-dashboard");
  const lesson = $("view-lesson");
  const m = hash.match(/^#lesson\/([\w-]+)$/);
  if (m){
    renderLessonView(m[1]);
    if (!dash.classList.contains("offstage")){
      switchView(lesson, dash, 1);
    } else {
      lesson.classList.remove("offstage");
      window.scrollTo(0, 0);
    }
  } else {
    currentLessonId = null;
    if (!lesson.classList.contains("offstage")){
      switchView(dash, lesson, -1);
    } else {
      dash.classList.remove("offstage");
    }
    renderCarousel();
    renderProgressBars(true);
  }
}

window.addEventListener("hashchange", route);

function lessonShell(lesson, stepsHTML, stepCount){
  return `
  <div class="ltop">
    <button class="lback" onclick="goDashboard()" aria-label="Back to dashboard">←</button>
    <div class="ltitle">${escHTML(lesson.title)}</div>
    <div class="lxp">+${lesson.xp} XP</div>
  </div>
  <div class="ldots" id="ldots">${Array.from({length: stepCount}, (_, i) =>
    `<div class="ldot ${i === 0 ? "now" : ""}"></div>`).join("")}</div>
  <div class="lsteps" id="lsteps">${stepsHTML}</div>`;
}

function voice(text){
  return `<div class="voice"><div class="voice-label">STAND</div><div class="voice-text">${text}</div></div>`;
}

function setStep(n, dir){
  const steps = document.querySelectorAll("#lsteps .lstep");
  steps.forEach((s, i) => {
    s.classList.remove("active", "from-left");
    if (i === n){
      s.classList.add("active");
      if (dir === -1) s.classList.add("from-left");
    }
  });
  const dots = document.querySelectorAll("#ldots .ldot");
  dots.forEach((d, i) => {
    d.classList.remove("now", "done");
    if (i < n) d.classList.add("done");
    if (i === n) d.classList.add("now");
  });
  currentStep = n;
  window.scrollTo(0, 0);
}

function nextStep(){ setStep(currentStep + 1, 1); afterStepShow(); }
function prevStep(){ setStep(currentStep - 1, -1); }

function afterStepShow(){
  const m = location.hash.match(/^#lesson\/([\w-]+)$/);
  const id = currentLessonId || (m && m[1]);
  if (id === "price-it-right" && currentStep === 2) renderPricingCard();
  if (id === "find-your-customer" && currentStep === 2) renderCustomerCard();
  if (id === "launch-plan" && currentStep === 3) renderLaunchPlanCard();
}

function renderLessonView(id){
  currentLessonId = id;
  currentStep = 0;
  const lesson = LESSONS.find(l => l.id === id);
  const col = $("lesson-col");
  if (!lesson){
    col.innerHTML = placeholderView({ title: "Lesson", xp: 0 }, "🔒", "This lesson is coming soon", "Check back after your next unlock.");
    return;
  }
  if (lesson.status === "COMPLETED"){
    col.innerHTML = placeholderView(lesson, "🏆", "You completed this lesson!", `You earned +${lesson.xp} XP for ${USER.businessName}. Nice work, ${USER.name}.`);
    return;
  }
  if (id === "price-it-right"){ col.innerHTML = buildPriceItRight(lesson); setStep(0, 1); recalcPrice(); return; }
  if (id === "find-your-customer"){ col.innerHTML = buildFindCustomer(lesson); setStep(0, 1); updateCustomerPreview(); return; }
  if (id === "launch-plan"){ col.innerHTML = buildLaunchPlan(lesson); setStep(0, 1); updateWarmTotal(); updateChannelUI(); return; }
  col.innerHTML = placeholderView(lesson, "🔒", "This lesson is coming soon", "We are still building this one. Check back soon!");
}

function recalcPrice(){
  const s = lessonState["price-it-right"];
  s.ing = parseFloat($("pir-ing") && $("pir-ing").value) || 0;
  s.pack = parseFloat($("pir-pack") && $("pir-pack").value) || 0;
  s.rate = parseFloat($("pir-rate") && $("pir-rate").value) || 0;
  s.hours = parseFloat($("pir-hours") && $("pir-hours").value) || 0;
  /* per-unit cost: ingredients + labour spread over a 12-cupcake batch, plus per-unit packaging */
  const cost = (s.ing + s.rate * s.hours) / 12 + s.pack;
  const price = Math.max(0.5, Math.round(cost * 2.5 / 0.5) * 0.5);
  const profit = price - cost;
  const margin = price > 0 ? profit / price : 0;
  s.cost = cost; s.price = price; s.profit = profit;

  const costEl = $("pir-cost"), priceEl = $("pir-price");
  if (!costEl) return;
  costEl.textContent = fmt$(cost);
  priceEl.textContent = fmt$(price);
  priceEl.classList.remove("pop");
  void priceEl.offsetWidth;
  priceEl.classList.add("pop");
  $("pir-profit").textContent = "Profit per sale: " + fmt$(profit);

  const v = $("pir-voice");
  if (v){
    if (margin < 0.30){
      v.textContent = "Hmm, that's tight. You'd be working really hard for not much profit.";
    } else if (margin <= 0.60){
      v.textContent = "That's a solid price. You'll make real money and customers will think it's fair.";
    } else {
      v.textContent = "Wow, great margins! Make sure it still feels like good value to your customers.";
    }
  }
}

function renderPricingCard(){
  const s = lessonState["price-it-right"];
  $("pir-card-price").textContent = fmt$(s.price);
  $("pir-card-profit").textContent = fmt$(s.profit);
  $("pir-voice-3").textContent = `That's your pricing locked in, Alice. ${fmt$(s.price)} per cupcake — and you keep ${fmt$(s.profit)} every time you sell one. That's real money.`;
}

function savePricingCard(){

  copyText(text, $("pir-save"));
}

  const s = lessonState["launch-plan"];
  const opt = LAUNCH_OPTIONS.find(o => o.id === s.when) || LAUNCH_OPTIONS[0];
  const d = new Date(Date.now() + opt.days * 86400000);
  return d.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
}

function joinAnd(arr){
  if (arr.length <= 1) return arr.join("");
  return arr.slice(0, -1).join(", ") + " and " + arr[arr.length - 1];
}

function launchPlanData(){
  const s = lessonState["launch-plan"];
  const warm = [...s.family, ...s.friends, ...s.neighbours];
  const chans = CHANNELS.filter(c => s.channels.includes(c.id)).map(c => c.name);
  const date = launchDateString();
  const warmNames = warm.length ? warm.slice(0, 4).join(", ") + (warm.length > 4 ? ` and ${warm.length - 4} more` : "") : "your warm list";
  const firstChans = chans.slice(0, Math.max(1, Math.ceil(chans.length / 2)));
  const restChans = chans.slice(firstChans.length);
  let para = `On ${date}, Alice's Sweet Sensations launches. First up: ${warmNames} hear about it via ${joinAnd(firstChans)}.`;
  if (restChans.length){
    para += ` Then ${restChans.length === 1 ? restChans[0] + " goes" : joinAnd(restChans) + " go"} live to reach new customers.`;
  }
  return { warm, chans, date, para };
}

function renderLaunchPlanCard(){
  const d = launchPlanData();
  $("lp-card-date").textContent = d.date;
  $("lp-card-warm").textContent = `Warm list: ${d.warm.length} ${d.warm.length === 1 ? "person" : "people"}`;
  $("lp-card-channels").textContent = `Channels: ${d.chans.join(", ")}`;
  $("lp-card-para").textContent = d.para;
}

function saveLaunchPlan(){
  const d = launchPlanData();
  const text = `Alice's Sweet Sensations — Launch Plan\nLaunch date: ${d.date}\nWarm list: ${d.warm.length} people${d.warm.length ? " (" + d.warm.join(", ") + ")" : ""}\nChannels: ${d.chans.join(", ")}\n\n${d.para}\n\nBuilt with STAND`;
  copyText(text, $("lp-save"));
}

/* ════════════════════════ CLIPBOARD ════════════════════════ */

function copyText(text, btn){
  const done = () => {
    if (!btn) return;
    const orig = btn.textContent;
    btn.textContent = "Copied!";
    setTimeout(() => { btn.textContent = orig; }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); } catch(e){}
  ta.remove();
  done();
}

/* ════════════════════════ LESSON COMPLETION ════════════════════════ */

function finishLesson(id){
  const lesson = LESSONS.find(l => l.id === id);
  pendingCompleteLesson = lesson;
  $("ov-xp").textContent = `+${lesson.xp} XP earned!`;
  $("ov-headline").textContent = `${USER.businessName} just levelled up`;
  $("complete-overlay").classList.add("show");
}

function overlayDone(){
  const lesson = pendingCompleteLesson;
  pendingCompleteLesson = null;
  $("complete-overlay").classList.remove("show");
  if (lesson && lesson.status !== "COMPLETED"){
    lesson.status = "COMPLETED";
    if (!USER.completedModules.includes(lesson.id)) USER.completedModules.push(lesson.id);
    goDashboard();
    setTimeout(() => {
      xpToast(`+${lesson.xp} XP`);
      addXP(lesson.xp);
    }, 380);
  } else {
    goDashboard();
  }
}

  renderSnapshot();
  renderTasks();

  renderBadges();
  renderOtherBusinesses();
  refreshXPUI(true);
  renderProgressBars(true);

}

document.addEventListener("DOMContentLoaded", init);
