<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Store — Powered by STAND</title>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Manrope:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:'Manrope',sans-serif;background:#1A1A1A}
.bagel{font-family:'Bagel Fat One',system-ui,sans-serif;line-height:1.05}
.caveat{font-family:'Caveat',cursive;font-weight:700}

.shell{max-width:480px;margin:0 auto;min-height:100vh;background:#FFF8E7;position:relative;overflow:hidden;display:flex;flex-direction:column}

/* ── TOP BAR ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:#FFF8E7;position:sticky;top:0;z-index:20;border-bottom:2px solid rgba(26,26,26,.06)}
.back-link{font-size:13px;font-weight:700;color:rgba(26,26,26,.55);text-decoration:none;transition:color .15s}
.back-link:hover{color:#1A1A1A}
.powered{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(26,26,26,.4)}
.powered .stand{font-family:'Bagel Fat One',system-ui,sans-serif;font-size:13px;color:#E5341A;letter-spacing:0;text-transform:none}

/* ── HERO ── */
.hero{background:#E5341A;padding:36px 24px 32px;text-align:center;position:relative;transition:background .2s}
.hero-avatar{
  width:72px;height:72px;border-radius:50%;background:#7B2FBE;color:#FFF8E7;
  font-family:'Bagel Fat One',system-ui,sans-serif;font-size:26px;
  display:flex;align-items:center;justify-content:center;margin:0 auto 14px;
  border:4px solid #FFF8E7;box-shadow:0 4px 0 rgba(0,0,0,.2);
}
.hero-name{font-size:clamp(30px,8vw,38px);color:#FFF8E7;margin-bottom:8px}
.hero-tag{font-size:24px;color:rgba(255,248,231,.85)}
.hero-pills{display:flex;justify-content:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.hero-pill{
  background:rgba(0,0,0,.18);color:#FFF8E7;font-size:11px;font-weight:700;
  padding:6px 12px;border-radius:14px;
}
/* dark-text variant for light brand colours (e.g. amber) */
.hero.dark .hero-name{color:#1A1A1A}
.hero.dark .hero-tag{color:rgba(26,26,26,.7)}
.hero.dark .hero-pill{background:rgba(26,26,26,.12);color:#1A1A1A}

/* ── MENU ── */
.menu{padding:28px 20px 140px;flex:1}
.menu-h{font-family:'Bagel Fat One',system-ui,sans-serif;font-size:24px;color:#1A1A1A;margin-bottom:4px}
.menu-sub{font-size:14px;color:rgba(26,26,26,.55);margin-bottom:20px}
.products{display:flex;flex-direction:column;gap:14px}
.product{
  background:#FFF;border-radius:18px;padding:16px;display:flex;gap:14px;align-items:center;
  border:2px solid rgba(26,26,26,.06);transition:border-color .15s;
}
.product.in-cart{border-color:#E5341A}
.p-emoji{
  width:64px;height:64px;border-radius:14px;font-size:32px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.p-info{flex:1;min-width:0}
.p-name{font-family:'Bagel Fat One',system-ui,sans-serif;font-size:16px;color:#1A1A1A;line-height:1.15}
.p-desc{font-size:12px;color:rgba(26,26,26,.5);margin-top:3px;line-height:1.4}
.p-price{font-size:14px;font-weight:800;color:#E5341A;margin-top:5px}
.p-ctrl{flex-shrink:0;display:flex;align-items:center}
.add-btn{
  width:38px;height:38px;border-radius:50%;border:none;background:#E5341A;color:#FFF8E7;
  font-size:22px;font-weight:700;cursor:pointer;line-height:1;
  box-shadow:0 3px 0 #a81e08;transition:transform .12s;
  display:flex;align-items:center;justify-content:center;font-family:'Manrope',sans-serif;
}
.add-btn:active{transform:translateY(2px) scale(.95);box-shadow:0 1px 0 #a81e08}
.stepper{display:flex;align-items:center;gap:10px}
.step-btn{
  width:32px;height:32px;border-radius:50%;border:2px solid #1A1A1A;background:#FFF8E7;
  color:#1A1A1A;font-size:18px;font-weight:800;cursor:pointer;line-height:1;
  display:flex;align-items:center;justify-content:center;transition:transform .12s;
  font-family:'Manrope',sans-serif;
}
.step-btn:active{transform:scale(.92)}
.step-qty{font-family:'Bagel Fat One',system-ui,sans-serif;font-size:18px;color:#1A1A1A;min-width:18px;text-align:center}

/* ── OTHER STORES STRIP ── */
.other-stores{padding:0 20px 28px}
.os-h{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(26,26,26,.4);margin-bottom:12px}
.os-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.os-card{
  flex-shrink:0;display:flex;align-items:center;gap:8px;text-decoration:none;
  background:#FFF;border:2px solid rgba(26,26,26,.07);border-radius:14px;padding:10px 14px;
  transition:border-color .15s,transform .12s;
}
.os-card:active{transform:scale(.97)}
.os-card:hover{border-color:#1A1A1A}
.os-emoji{font-size:20px}
.os-name{font-family:'Bagel Fat One',system-ui,sans-serif;font-size:12px;color:#1A1A1A;white-space:nowrap}

/* ── CART BAR ── */
.cart-bar{
  position:fixed;bottom:0;left:50%;transform:translate(-50%,110%);
  width:100%;max-width:480px;padding:14px 20px 22px;
  background:#1A1A1A;border-radius:22px 22px 0 0;z-index:30;
  transition:transform .3s cubic-bezier(.34,1.3,.64,1);
}
.cart-bar.show{transform:translate(-50%,0)}
.cart-btn{
  display:flex;justify-content:space-between;align-items:center;width:100%;
  padding:16px 22px;border:none;border-radius:16px;background:#FFD93D;color:#1A1A1A;
  font-family:'Bagel Fat One',system-ui,sans-serif;font-size:17px;cursor:pointer;
  box-shadow:0 4px 0 #c9a800;transition:transform .12s,box-shadow .12s;
}
.cart-btn:active{transform:translateY(2px) scale(.98);box-shadow:0 2px 0 #c9a800}
.cart-count{font-size:13px;font-family:'Manrope',sans-serif;font-weight:800;opacity:.7}

/* ── ORDER SHEET ── */
.sheet-veil{
  position:fixed;inset:0;background:rgba(26,26,26,.55);opacity:0;pointer-events:none;
  transition:opacity .25s;z-index:40;
}
.sheet-veil.show{opacity:1;pointer-events:all}
.sheet{
  position:fixed;bottom:0;left:50%;transform:translate(-50%,105%);
  width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
  background:#FFF8E7;border-radius:24px 24px 0 0;padding:24px 22px 32px;z-index:50;
  transition:transform .32s cubic-bezier(.34,1.2,.64,1);
}
.sheet.show{transform:translate(-50%,0)}
.sheet-grab{width:44px;height:5px;border-radius:3px;background:rgba(26,26,26,.15);margin:0 auto 18px}
.sheet-h{font-family:'Bagel Fat One',system-ui,sans-serif;font-size:24px;color:#1A1A1A;margin-bottom:18px}
.order-lines{background:#FFF;border-radius:16px;padding:6px 18px;margin-bottom:18px;border:2px solid rgba(26,26,26,.06)}
.order-line{display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-bottom:1px solid rgba(26,26,26,.07);font-size:14px;font-weight:600;color:#1A1A1A}
.order-line:last-child{border-bottom:none}
.ol-qty{color:#E5341A;font-weight:800;margin-right:6px}
.ol-price{font-family:'Bagel Fat One',system-ui,sans-serif;font-size:15px}
.order-line.total{font-family:'Bagel Fat One',system-ui,sans-serif;font-size:17px}
.order-line.total .ol-price{font-size:19px;color:#E5341A}

.form-field{margin-bottom:14px}
.ff-label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(26,26,26,.45);margin-bottom:8px}
.ff-input{
  width:100%;border:2px solid rgba(26,26,26,.1);border-radius:14px;background:#FFF;
  font-family:'Manrope',sans-serif;font-size:16px;font-weight:600;color:#1A1A1A;
  padding:14px 16px;outline:none;transition:border-color .15s;resize:none;
}
.ff-input:focus{border-color:#1A1A1A}
.ff-input::placeholder{color:rgba(26,26,26,.25);font-style:italic}

.btn{
  display:block;width:100%;padding:18px 24px;border:none;border-radius:16px;
  font-family:'Bagel Fat One',system-ui,sans-serif;font-size:18px;cursor:pointer;
  text-align:center;line-height:1;transition:transform .12s,box-shadow .12s,opacity .12s;
}
.btn-red{background:#E5341A;color:#FFF8E7;box-shadow:0 4px 0 #a81e08}
.btn-red:active{transform:translateY(2px) scale(.98);box-shadow:0 2px 0 #a81e08}
.btn:disabled{opacity:.35;pointer-events:none;box-shadow:none}

/* ── CONFIRMATION ── */
.confirm{
  position:fixed;inset:0;background:#FFD93D;z-index:60;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:32px 24px;
  opacity:0;pointer-events:none;transition:opacity .3s;overflow-y:auto;
}
.confirm.show{opacity:1;pointer-events:all}
.confirm-inner{max-width:480px;width:100%;display:flex;flex-direction:column;align-items:center}
.confirm-emoji{font-size:64px;margin-bottom:14px;animation:bounceIn .5s cubic-bezier(.34,1.56,.64,1) both}
@keyframes bounceIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.confirm-h{font-family:'Bagel Fat One',system-ui,sans-serif;font-size:clamp(28px,8vw,38px);color:#1A1A1A;margin-bottom:8px}
.confirm-caveat{font-family:'Caveat',cursive;font-weight:700;font-size:24px;color:rgba(26,26,26,.6);margin-bottom:28px}
.receipt{
  background:#FFF;border-radius:20px;width:100%;max-width:340px;overflow:hidden;text-align:left;
  box-shadow:0 8px 40px rgba(26,26,26,.18);animation:cardIn .45s cubic-bezier(.34,1.56,.64,1) .15s both;
  margin-bottom:28px;
}
@keyframes cardIn{from{transform:scale(.88) translateY(14px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.receipt-head{background:#1A1A1A;padding:16px 20px}
.receipt-tag{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,248,231,.4);margin-bottom:5px}
.receipt-biz{font-family:'Bagel Fat One',system-ui,sans-serif;font-size:17px;color:#FFF8E7}
.receipt-body{padding:8px 20px}
.receipt-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(26,26,26,.07);font-size:13px;font-weight:600;color:#1A1A1A}
.receipt-row:last-child{border-bottom:none}
.receipt-row.r-total{font-family:'Bagel Fat One',system-ui,sans-serif;font-size:15px}
.receipt-row.r-total span:last-child{color:#E5341A;font-size:17px}
.receipt-foot{padding:12px 20px;border-top:1px solid rgba(26,26,26,.07);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(26,26,26,.35)}
.confirm-actions{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
.btn-black{background:#1A1A1A;color:#FFF8E7;box-shadow:0 4px 0 #000}
.btn-black:active{transform:translateY(2px) scale(.98);box-shadow:0 2px 0 #000}
.btn-ghost{background:transparent;color:#1A1A1A;box-shadow:none;border:2.5px solid #1A1A1A}
.btn-ghost:active{transform:scale(.98)}

/* ── FOOTER ── */
.store-foot{padding:20px;text-align:center;font-size:11px;font-weight:600;color:rgba(26,26,26,.35)}
.store-foot .stand{font-family:'Bagel Fat One',system-ui,sans-serif;color:#E5341A;font-size:12px}
</style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <a class="back-link" href="./index.html#dashboard">← Back to dashboard</a>
    <div class="powered">Powered by <span class="stand">STAND</span></div>
  </div>

  <div class="hero" id="hero">
    <div class="hero-avatar" id="hero-avatar"></div>
    <h1 class="bagel hero-name" id="hero-name"></h1>
    <p class="caveat hero-tag" id="hero-tag"></p>
    <div class="hero-pills" id="hero-pills"></div>
  </div>

  <div class="menu">
    <h2 class="menu-h" id="menu-h">The menu</h2>
    <p class="menu-sub" id="menu-sub"></p>
    <div class="products" id="products"></div>
  </div>

  <div class="other-stores">
    <div class="os-h">Visit other kids on Stand</div>
    <div class="os-row" id="os-row"></div>
  </div>

  <div class="store-foot">This store was built by a kid CEO on <span class="stand">STAND</span></div>

</div>

<!-- cart bar -->
<div class="cart-bar" id="cart-bar">
  <button class="cart-btn" onclick="openSheet()">
    <span>Review my order</span>
    <span><span class="cart-count" id="cart-count">0 items</span> &nbsp; <span id="cart-total">$0.00</span></span>
  </button>
</div>

<!-- order sheet -->
<div class="sheet-veil" id="sheet-veil" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-grab"></div>
  <h3 class="sheet-h">Your order</h3>
  <div class="order-lines" id="order-lines"></div>
  <div class="form-field">
    <div class="ff-label">Your name</div>
    <input class="ff-input" id="o-name" type="text" placeholder="" oninput="checkForm()">
  </div>
  <div class="form-field">
    <div class="ff-label" id="note-label">Anything to know?</div>
    <textarea class="ff-input" id="o-note" rows="2" placeholder=""></textarea>
  </div>
  <button class="btn btn-red" id="place-btn" onclick="placeOrder()" disabled>Place my order</button>
</div>

<!-- confirmation -->
<div class="confirm" id="confirm">
  <div class="confirm-inner">
    <div class="confirm-emoji" id="confirm-emoji">🧁</div>
    <h2 class="confirm-h">Order placed!</h2>
    <p class="confirm-caveat" id="confirm-caveat"></p>
    <div class="receipt">
      <div class="receipt-head">
        <div class="receipt-tag">Order confirmation</div>
        <div class="receipt-biz" id="receipt-biz"></div>
      </div>
      <div class="receipt-body" id="receipt-body"></div>
      <div class="receipt-foot" id="receipt-foot"></div>
    </div>
    <div class="confirm-actions">
      <button class="btn btn-black" id="more-btn" onclick="resetStore()">Order more</button>
      <a class="btn btn-ghost" href="./index.html#dashboard" style="text-decoration:none">Back to dashboard</a>
    </div>
  </div>
</div>

<script>
(function(){

var BUSINESSES = {
  alice: {
    name: "Alice's Sweet Sensations",
    owner: "Alice", their: "her",
    initials: "AS", avatarColor: "#7B2FBE", brandColor: "#E5341A", heroDark: false,
    tagline: "Homemade cupcakes, baked with love.",
    typePill: "🧁 Baked Goods",
    menuSub: "Tap + to add cupcakes to your order.",
    emoji: "🧁",
    products: [
      { id: "classic", name: "Classic Vanilla", desc: "Fluffy vanilla sponge with buttercream swirl.", emoji: "🧁", bg: "#FDE8E6", price: 4.00 },
      { id: "choc", name: "Double Chocolate", desc: "Rich cocoa sponge, chocolate frosting on top.", emoji: "🍫", bg: "#F3E8FB", price: 4.50 },
      { id: "berry", name: "Strawberry Surprise", desc: "Strawberry sponge with a jam centre.", emoji: "🍓", bg: "#FDEEDC", price: 4.50 },
      { id: "rainbow", name: "Rainbow Party Box", desc: "Six mini cupcakes in six colours. Party-ready.", emoji: "🌈", bg: "#E6F4EC", price: 12.00 }
    ]
  },
  jake: {
    name: "Jake's Sticker Lab",
    owner: "Jake", their: "his",
    initials: "JS", avatarColor: "#1A1A1A", brandColor: "#E63946", heroDark: false,
    tagline: "Stickers for everything you own.",
    typePill: "🎨 Stickers",
    menuSub: "Tap + to add stickers to your order.",
    emoji: "🎨",
    products: [
      { id: "holo", name: "Holographic Pack", desc: "Ten shiny holographic stickers that catch the light.", emoji: "✨", bg: "#F3E8FB", price: 3.00 },
      { id: "name", name: "Custom Name Sticker", desc: "Your name in Jake's signature bubble style.", emoji: "✏️", bg: "#FDE8E6", price: 2.50 },
      { id: "laptop", name: "Laptop Mega Pack", desc: "Twenty-five stickers to cover a whole laptop lid.", emoji: "💻", bg: "#E6F4EC", price: 6.00 },
      { id: "mystery", name: "Mystery Sticker Bag", desc: "Eight surprise stickers. No two bags the same.", emoji: "🎁", bg: "#FDEEDC", price: 4.00 }
    ]
  },
  maya: {
    name: "Maya's Jewels",
    owner: "Maya", their: "her",
    initials: "MJ", avatarColor: "#1A1A1A", brandColor: "#7B2FBE", heroDark: false,
    tagline: "Handmade jewellery, made to sparkle.",
    typePill: "💎 Jewelry",
    menuSub: "Tap + to add pieces to your order.",
    emoji: "💎",
    products: [
      { id: "bracelet", name: "Beaded Bracelet", desc: "Hand-strung glass beads. Pick any colour combo.", emoji: "📿", bg: "#F3E8FB", price: 5.00 },
      { id: "necklace", name: "Friendship Necklace Set", desc: "Two matching halves — one for you, one for them.", emoji: "💞", bg: "#FDE8E6", price: 8.00 },
      { id: "anklet", name: "Charm Anklet", desc: "Delicate chain with three hand-picked charms.", emoji: "🐚", bg: "#E6F4EC", price: 6.50 },
      { id: "ring", name: "Custom Initial Ring", desc: "Wire-wrapped ring with the letter of your choice.", emoji: "💍", bg: "#FDEEDC", price: 7.00 }
    ]
  },
  theo: {
    name: "Theo's Snack Co",
    owner: "Theo", their: "his",
    initials: "TS", avatarColor: "#1A1A1A", brandColor: "#F4A261", heroDark: true,
    tagline: "Snacks so good they sell themselves.",
    typePill: "🍿 Snacks",
    menuSub: "Tap + to add snacks to your order.",
    emoji: "🍿",
    products: [
      { id: "trailmix", name: "Trail Mix Bag", desc: "Nuts, raisins and chocolate chips. The classic.", emoji: "🥜", bg: "#FDEEDC", price: 3.50 },
      { id: "popcorn", name: "Sweet & Spicy Popcorn", desc: "Theo's secret seasoning. Mildly famous locally.", emoji: "🍿", bg: "#FDE8E6", price: 4.00 },
      { id: "cookies", name: "Choc-Chip Cookie 3-Pack", desc: "Baked fresh, slightly gooey in the middle.", emoji: "🍪", bg: "#F3E8FB", price: 5.00 },
      { id: "bundle", name: "Snack Box Bundle", desc: "One of everything in a box. Movie night sorted.", emoji: "📦", bg: "#E6F4EC", price: 10.00 }
    ]
  },
  sofia: {
    name: "Sofia's Skincare",
    owner: "Sofia", their: "her",
    initials: "SS", avatarColor: "#1A1A1A", brandColor: "#2D9F6E", heroDark: false,
    tagline: "Gentle skincare, made by hand.",
    typePill: "✨ Skincare",
    menuSub: "Tap + to add products to your order.",
    emoji: "✨",
    products: [
      { id: "balm", name: "Honey Lip Balm", desc: "Beeswax and honey. Small batch, big shine.", emoji: "🍯", bg: "#FDEEDC", price: 4.00 },
      { id: "scrub", name: "Sugar Scrub Jar", desc: "Brown sugar and coconut oil hand scrub.", emoji: "🥥", bg: "#E6F4EC", price: 7.00 },
      { id: "bath", name: "Lavender Bath Salts", desc: "Relaxing lavender salts in a glass jar.", emoji: "💜", bg: "#F3E8FB", price: 6.00 },
      { id: "giftset", name: "Self-Care Gift Set", desc: "All three products in a ribboned gift box.", emoji: "🎀", bg: "#FDE8E6", price: 15.00 }
    ]
  }
};

var bizId = new URLSearchParams(window.location.search).get("biz") || "alice";
if (!BUSINESSES[bizId]) bizId = "alice";
var BIZ = BUSINESSES[bizId];

var cart = {}; // product id -> qty

function money(n){ return "$" + n.toFixed(2); }

function renderStore(){
  document.title = BIZ.name + " — Powered by STAND";

  var hero = document.getElementById("hero");
  hero.style.background = BIZ.brandColor;
  hero.classList.toggle("dark", BIZ.heroDark);

  var avatar = document.getElementById("hero-avatar");
  avatar.textContent = BIZ.initials;
  avatar.style.background = BIZ.avatarColor;

  document.getElementById("hero-name").textContent = BIZ.name;
  document.getElementById("hero-tag").textContent = BIZ.tagline;
  document.getElementById("hero-pills").innerHTML =
    '<span class="hero-pill">' + BIZ.typePill + '</span>'
    + '<span class="hero-pill">⭐ Kid-run business</span>'
    + '<span class="hero-pill">📍 Local pickup</span>';

  document.getElementById("menu-sub").textContent = BIZ.menuSub;
  document.getElementById("o-name").placeholder = "Who should " + BIZ.owner + " make these for?";
  document.getElementById("note-label").textContent = "Anything " + BIZ.owner + " should know?";
  document.getElementById("o-note").placeholder = "Allergies, a special request, pickup time...";
  document.getElementById("confirm-emoji").textContent = BIZ.emoji;
  document.getElementById("confirm-caveat").textContent = BIZ.owner + " just made " + BIZ.their + " next sale.";
  document.getElementById("receipt-biz").textContent = BIZ.name;

  renderOtherStores();
  renderProducts();
}

function renderOtherStores(){
  var html = "";
  Object.keys(BUSINESSES).forEach(function(id){
    if (id === bizId) return;
    var b = BUSINESSES[id];
    html += '<a class="os-card" href="./store.html?biz=' + id + '">'
      + '<span class="os-emoji">' + b.emoji + '</span>'
      + '<span class="os-name">' + b.name + '</span>'
      + '</a>';
  });
  document.getElementById("os-row").innerHTML = html;
}

function cartCount(){
  var t = 0;
  for (var k in cart) t += cart[k];
  return t;
}
function cartTotal(){
  var t = 0;
  BIZ.products.forEach(function(p){ if (cart[p.id]) t += cart[p.id] * p.price; });
  return t;
}

function renderProducts(){
  var html = "";
  BIZ.products.forEach(function(p){
    var qty = cart[p.id] || 0;
    html += '<div class="product' + (qty > 0 ? ' in-cart' : '') + '" id="prod-' + p.id + '">'
      + '<div class="p-emoji" style="background:' + p.bg + '">' + p.emoji + '</div>'
      + '<div class="p-info">'
      +   '<div class="p-name">' + p.name + '</div>'
      +   '<div class="p-desc">' + p.desc + '</div>'
      +   '<div class="p-price">' + money(p.price) + '</div>'
      + '</div>'
      + '<div class="p-ctrl">'
      + (qty === 0
          ? '<button class="add-btn" onclick="addItem(\'' + p.id + '\')">+</button>'
          : '<div class="stepper">'
            + '<button class="step-btn" onclick="changeQty(\'' + p.id + '\',-1)">−</button>'
            + '<span class="step-qty">' + qty + '</span>'
            + '<button class="step-btn" onclick="changeQty(\'' + p.id + '\',1)">+</button>'
            + '</div>')
      + '</div></div>';
  });
  document.getElementById("products").innerHTML = html;
  updateCartBar();
}

function addItem(id){
  cart[id] = 1;
  renderProducts();
}
window.addItem = addItem;

function changeQty(id, delta){
  cart[id] = (cart[id] || 0) + delta;
  if (cart[id] <= 0) delete cart[id];
  renderProducts();
}
window.changeQty = changeQty;

function updateCartBar(){
  var n = cartCount();
  var bar = document.getElementById("cart-bar");
  if (n > 0){
    bar.classList.add("show");
    document.getElementById("cart-count").textContent = n + (n === 1 ? " item" : " items");
    document.getElementById("cart-total").textContent = money(cartTotal());
  } else {
    bar.classList.remove("show");
    closeSheet();
  }
}

function openSheet(){
  var html = "";
  BIZ.products.forEach(function(p){
    if (!cart[p.id]) return;
    html += '<div class="order-line">'
      + '<span><span class="ol-qty">' + cart[p.id] + '×</span>' + p.name + '</span>'
      + '<span class="ol-price">' + money(cart[p.id] * p.price) + '</span>'
      + '</div>';
  });
  html += '<div class="order-line total"><span>Total</span><span class="ol-price">' + money(cartTotal()) + '</span></div>';
  document.getElementById("order-lines").innerHTML = html;
  document.getElementById("sheet-veil").classList.add("show");
  document.getElementById("sheet").classList.add("show");
  checkForm();
}
window.openSheet = openSheet;

function closeSheet(){
  document.getElementById("sheet-veil").classList.remove("show");
  document.getElementById("sheet").classList.remove("show");
}
window.closeSheet = closeSheet;

function checkForm(){
  var name = document.getElementById("o-name").value.trim();
  document.getElementById("place-btn").disabled = !(name.length > 0 && cartCount() > 0);
}
window.checkForm = checkForm;

function placeOrder(){
  var name = document.getElementById("o-name").value.trim();
  var note = document.getElementById("o-note").value.trim();

  var html = "";
  BIZ.products.forEach(function(p){
    if (!cart[p.id]) return;
    html += '<div class="receipt-row"><span>' + cart[p.id] + '× ' + p.name + '</span><span>' + money(cart[p.id] * p.price) + '</span></div>';
  });
  html += '<div class="receipt-row r-total"><span>Total</span><span>' + money(cartTotal()) + '</span></div>';
  document.getElementById("receipt-body").innerHTML = html;
  document.getElementById("receipt-foot").textContent =
    "Thanks, " + name + "! " + BIZ.owner + " will be in touch" + (note ? " — " + (BIZ.their === "her" ? "she" : "he") + " got your note." : ".");

  closeSheet();
  document.getElementById("confirm").classList.add("show");
}
window.placeOrder = placeOrder;

function resetStore(){
  cart = {};
  document.getElementById("o-name").value = "";
  document.getElementById("o-note").value = "";
  document.getElementById("confirm").classList.remove("show");
  renderProducts();
  window.scrollTo(0, 0);
}
window.resetStore = resetStore;

renderStore();

})();
</script>
</body>
</html>
