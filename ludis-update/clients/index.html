<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>[ludis] — Client Access</title>
<meta name="description" content="Private client workspace for Ludis Management Ltd.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:     #f5f2ec;
    --bg2:    #edeae2;
    --bg3:    #e4e0d6;
    --line:   #d4cfc4;
    --olive:  #4a5240;
    --olive2: #5c6650;
    --olive3: #6b7a5d;
    --text:   #1e1f1b;
    --muted:  #5a5c52;
    --dim:    #8a8c80;
    --error:  #8a3a2f;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    font-size: 16px;
    line-height: 1.7;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  nav {
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 28px 60px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(to bottom, rgba(245,242,236,0.97) 0%, rgba(245,242,236,0.85) 100%);
  }
  .nav-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-weight: 400;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--olive);
    text-decoration: none;
  }
  .nav-bracket { color: var(--olive3); font-weight: 300; }
  .nav-links { display: flex; gap: 40px; list-style: none; }
  .nav-links a {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dim);
    text-decoration: none;
    transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--olive); }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 80px 32px 120px;
    position: relative;
  }

  main::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
    pointer-events: none;
    opacity: 0.55;
    z-index: 0;
  }

  .auth-card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    background: var(--bg);
    border: 1px solid var(--line);
    padding: 56px 52px 48px;
  }

  .auth-eyebrow {
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--olive3);
    margin-bottom: 24px;
  }

  .auth-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 42px;
    font-weight: 300;
    line-height: 1.05;
    letter-spacing: -0.01em;
    color: var(--olive);
    margin-bottom: 20px;
  }
  .auth-title em { font-style: italic; color: var(--olive3); }

  .auth-desc {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.8;
    margin-bottom: 36px;
  }

  form { display: flex; flex-direction: column; gap: 20px; }

  label {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .label-text {
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--olive3);
  }

  input[type="email"], input[type="password"] {
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    padding: 10px 0 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    font-weight: 300;
    color: var(--text);
    transition: border-color 0.2s;
  }
  input:focus { outline: none; border-bottom-color: var(--olive); }
  input::placeholder { color: var(--dim); font-weight: 300; }

  button[type="submit"] {
    margin-top: 16px;
    background: var(--olive);
    color: var(--bg);
    border: none;
    padding: 16px 24px;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s;
  }
  button[type="submit"]:hover:not(:disabled) { background: var(--olive2); }
  button[type="submit"]:disabled { opacity: 0.5; cursor: wait; }

  .auth-status {
    font-size: 13px;
    margin-top: 4px;
    min-height: 1.4em;
  }
  .auth-status.error { color: var(--error); }
  .auth-status.info  { color: var(--muted); }

  .auth-footnote {
    margin-top: 36px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--dim);
    line-height: 1.7;
  }
  .auth-footnote a { color: var(--olive); text-decoration: none; }
  .auth-footnote a:hover { text-decoration: underline; }

  footer {
    background: var(--olive2);
    padding: 28px 60px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .footer-copy { font-size: 12px; color: rgba(245,242,236,0.38); letter-spacing: 0.05em; }
  .footer-links { display: flex; gap: 24px; }
  .footer-links a {
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(245,242,236,0.38);
    text-decoration: none;
    transition: color 0.2s;
  }
  .footer-links a:hover { color: var(--bg); }

  @media (max-width: 600px) {
    nav { padding: 24px 24px; }
    .nav-links { gap: 18px; }
    main { padding: 40px 20px 80px; }
    .auth-card { padding: 40px 28px 32px; }
    .auth-title { font-size: 34px; }
    footer { padding: 24px; flex-direction: column; gap: 12px; text-align: center; }
  }
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-name"><span class="nav-bracket">[</span>ludis<span class="nav-bracket">]</span></a>
  <ul class="nav-links">
    <li><a href="/#practices">Practices</a></li>
    <li><a href="/#how">How we work</a></li>
    <li><a href="/#contact">Contact</a></li>
  </ul>
</nav>

<main>
  <div class="auth-card">
    <p class="auth-eyebrow">Private &nbsp;·&nbsp; Client Workspace</p>
    <h1 class="auth-title">Client <em>access</em>.</h1>
    <p class="auth-desc">Enter the email and passphrase shared with you to view ongoing work for your organisation.</p>

    <form id="login-form" autocomplete="on" novalidate>
      <label>
        <span class="label-text">Email</span>
        <input type="email" name="email" id="email" required autocomplete="email" placeholder="you@yourcompany.com">
      </label>
      <label>
        <span class="label-text">Passphrase</span>
        <input type="password" name="password" id="password" required autocomplete="current-password" placeholder="•••••••••••">
      </label>
      <button type="submit" id="submit-btn">Sign in</button>
      <div class="auth-status" id="status" role="status" aria-live="polite"></div>
    </form>

    <div class="auth-footnote">
      Don't have credentials yet? <a href="mailto:dan@lud.is?subject=Client%20access">Email Dan</a> to request access.
    </div>
  </div>
</main>

<footer>
  <span class="footer-copy">© 2026 Ludis Management Ltd</span>
  <div class="footer-links">
    <a href="/privacy.html">Privacy</a>
    <a href="/terms.html">Terms</a>
    <a href="mailto:dan@lud.is">Contact</a>
  </div>
</footer>

<script src="/clients/auth.js"></script>
<script>
  // If they're already signed in, fast-forward.
  (function maybeBounce() {
    const existing = window.LudisAuth.getSession();
    if (existing) {
      const params = new URLSearchParams(location.search);
      const next = params.get('next');
      const target = (next && next.startsWith('/clients/')) ? next : ('/clients/' + existing.slug + '/');
      location.replace(target);
    }
  })();

  const form = document.getElementById('login-form');
  const status = document.getElementById('status');
  const btn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    status.className = 'auth-status info';
    status.textContent = 'Checking…';
    btn.disabled = true;

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
      const record = await window.LudisAuth.tryLogin(email, password);
      if (!record) {
        status.className = 'auth-status error';
        status.textContent = 'Those credentials did not match. Please try again or email Dan.';
        btn.disabled = false;
        return;
      }
      window.LudisAuth.setSession(record);
      const params = new URLSearchParams(location.search);
      const next = params.get('next');
      const target = (next && next.startsWith('/clients/')) ? next : ('/clients/' + record.slug + '/');
      status.className = 'auth-status info';
      status.textContent = 'Welcome, ' + record.name + '. Loading your workspace…';
      location.replace(target);
    } catch (err) {
      status.className = 'auth-status error';
      status.textContent = 'Something went wrong. Please try again.';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
